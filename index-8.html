<script type="module">

const firebaseConfig={apiKey:"AIzaSyCccgmFQCDeEIvm_UcC08_PCJQMl7gjmHc",authDomain:"x-treinos-alpha.firebaseapp.com",projectId:"x-treinos-alpha",storageBucket:"x-treinos-alpha.firebasestorage.app",messagingSenderId:"494624379702",appId:"1:494624379702:web:d7b3e02e562149dba89997"};

let ev=null,teams=[],contacts={},user=null,tab='i',at='e',cur=0,msg=null,busy=false;
let wk=[];
let regras=null,rd=null,ew='';
let me=null,team=null,mem=[],rq=[],allT=[],myst={},un=[],memOn=false,lf={e:'',p:'',tn:''},pf={n:'',f:''};
let f={n:'',w:'',p1:'',p2:'',p3:'',p4:'',s1:'',s2:''},lg={e:'',p:''},nf={n:'',d:''};

const note=(t,c)=>{msg={t,c}};

/* ---------- dados ---------- */
let unT=()=>{},unC=()=>{},evId=null;
onSnapshot(query(collection(db,'events'),orderBy('createdAt','desc'),limit(1)),s=>{
  const d=s.docs[0];
  if(!d){ev=null;teams=[];evId=null;unT();unC();render();return}
  ev={id:d.id,...d.data({serverTimestamps:'estimate'})};
  if(evId!==d.id){
    evId=d.id;ew='';unT();
    unT=onSnapshot(query(collection(db,'events',evId,'teams'),orderBy('createdAt')),ts=>{
      teams=ts.docs.map(x=>({id:x.id,name:x.data({serverTimestamps:'estimate'}).name}));render();

  }

},()=>{note('Não foi possível carregar o evento.','warn');render()});
const REDES=[{n:'TikTok',d:'Vídeos e novidades do Alpha Treinos',u:'https://www.tiktok.com/@maryaaah71'},{n:'Grupo do WhatsApp',d:'Avisos, resenha e suporte',u:'https://chat.whatsapp.com/ILSsjvMtP2U3UPyiu1hKAA'}];
const DEFAULT_REGRAS=[
 {t:'ESTILOS DE X-TREINO',x:'Segunda a quarta: estilo campeonato. Proibido full gás e cura (usar a Kessie não significa que o jogador é cura).\nQuinta e sexta: estilo guerra de guilda. Liberado full gás e cura.\nSexta começa às 17h, por causa da guerra de guilda.'},
 {t:'PONTUAÇÃO (ESTILO FFWS)',x:'Pontos por colocação + 1 ponto por abate.\n1º (Booyah) 12 • 2º 9 • 3º 8 • 4º 7 • 5º 6 • 6º 5\n7º 4 • 8º 3 • 9º 2 • 10º 1 • 11º e 12º 0\nDesempate: mais Booyahs, depois mais abates.'},
 {t:'INSCRIÇÃO',x:'12 vagas por ordem de chegada, sem lista de espera.\nAs inscrições fecham 1 a 2 horas antes do x-treino.\nO ID e a senha da sala são enviados pelos ADMs no grupo.'},
 {t:'REGRAS DAS SALAS',x:'Time que confirmar presença e não aparecer no horário será punido.\nQuem descumprir as regras da sala perde todos os pontos da queda. Em caso de reincidência, o time é removido do x-treino.\nA decisão final é sempre dos ADMs.'},
 {t:'REGRAS DO GRUPO',x:'Respeito entre todos, ADMs e membros: sem xingamentos e sem figurinhas inadequadas.\nNão nos responsabilizamos por mensagens de terceiros. Confie apenas nas mensagens dos ADMs.\nSem premiação: apenas treino e diversão.'}
];
const curRegras=()=>regras&&regras.length?regras:DEFAULT_REGRAS;
onSnapshot(doc(db,'config','regras'),s=>{const a=s.exists()?s.data().sections:null;regras=Array.isArray(a)&&a.length?a:null;render()},()=>{});
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const p2=n=>String(n).padStart(2,'0');
const fmtWhen=d=>DIAS[d.getDay()]+' · '+d.getHours()+'h'+(d.getMinutes()?p2(d.getMinutes()):'')+' · '+p2(d.getDate())+'/'+p2(d.getMonth()+1);
const startMs=()=>ev&&ev.startAt&&ev.startAt.toMillis?ev.startAt.toMillis():null;
const toLocalInput=()=>{const s=startMs();if(s===null)return '';const d=new Date(s);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
function cdInner(){
  const s=startMs();if(s===null)return '';
  const diff=s-Date.now();
  if(diff<=0)return '<div class="cdl">'+(-diff<4*3600e3?'EM ANDAMENTO':'X-TREINO ENCERRADO')+'</div>';
  let t=Math.floor(diff/1000);const dd=Math.floor(t/86400);t%=86400;const hh=Math.floor(t/3600);t%=3600;const mm=Math.floor(t/60),ss=t%60;
  const cell=(n,l)=>`<div class="cdc"><b>${n}</b><span>${l}</span></div>`;
  return '<div class="cdl">COMEÇA EM</div><div class="cdr">'+(dd?cell(dd,'dias')+'<i>:</i>':'')+cell(p2(hh),'horas')+'<i>:</i>'+cell(p2(mm),'min')+'<i>:</i>'+cell(p2(ss),'seg')+'</div>';
}
const countdownHtml=()=>startMs()===null?'':`<div class="card cd" id="cd">${cdInner()}</div>`;
setInterval(()=>{const e=$('cd');if(e)e.innerHTML=cdInner()},1000);

}
function regrasHtml(){
  return curRegras().map(s=>`<div class="card" style="padding:14px"><b style="color:var(--ac);letter-spacing:.06em">${esc(s.t)}</b><p class="rtxt" style="margin:8px 0 0">${esc(s.x)}</p></div>`).join('')+'<p class="muted">Regras definidas pelos ADMs.</p>';
}
function regrasAdmin(){
  if(!rd)rd=JSON.parse(JSON.stringify(curRegras()));
  let h='<p class="muted">Edite o que aparece na aba <b>Regras</b> do site. Cada seção tem um título e um texto (uma regra por linha). A pontuação aqui é só texto: ela não muda o cálculo do ranking.</p>';
  rd.forEach((s,i)=>{h+=`<div class="card" style="padding:12px"><label class="f"><span>Título</span><input maxlength="60" value="${esc(s.t)}" oninput="se(${i},'t',this.value)"></label><label class="f"><span>Texto</span><textarea oninput="se(${i},'x',this.value)">${esc(s.x)}</textarea></label><button class="b" onclick="rmSec(${i})">Remover seção</button></div>`});
  return h+`<div class="row"><button class="b" onclick="addSec()">+ Nova seção</button><button class="b" onclick="resetRegras()">Voltar ao padrão</button></div>${noteHtml()}<button class="b p" onclick="saveRegras()">Salvar regras</button>`;
}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
onSnapshot(query(collection(db,'events'),where('createdAt','>=',Timestamp.fromDate(weekStart()))),s=>{wk=s.docs.map(x=>({id:x.id,...x.data({serverTimestamps:'estimate'})}));render()},()=>{});
function subC(){
  unC();contacts={};
  if(!isAdm()||!evId)return;
  unC=onSnapshot(collection(db,'events',evId,'contacts'),cs=>{contacts={};cs.docs.forEach(x=>contacts[x.id]=x.data());render()},()=>{});
}
onAuthStateChanged(auth,u=>{user=u;subC();subMe();render()});
function subMe(){
  un.forEach(f=>f());un=[];memOn=false;me=null;team=null;mem=[];rq=[];myst={};
  if(!user)return;
  const uid=user.uid;
  un.push(onSnapshot(doc(db,'users',uid),s=>{me=s.exists()?s.data():null;if(me&&!pf.n&&!pf.f)pf={n:me.nick||'',f:me.ffId||''};loadMyst();render()},()=>{}));
  un.push(onSnapshot(doc(db,'teams',uid),s=>{
    team=s.exists()?{id:s.id,...s.data()}:null;
    if(team&&!memOn){memOn=true;
      un.push(onSnapshot(collection(db,'teams',uid,'members'),c=>{mem=c.docs.map(x=>({uid:x.id,...x.data()}));render()},()=>{}));
      un.push(onSnapshot(collection(db,'teams',uid,'requests'),c=>{rq=c.docs.map(x=>({uid:x.id,...x.data()}));render()},()=>{}));
    }
    render();},()=>{}));
}
onSnapshot(query(collection(db,'teams'),orderBy('createdAt')),s=>{allT=s.docs.map(x=>({id:x.id,...x.data({serverTimestamps:'estimate'})}));loadMyst();render()},()=>{});
async function loadMyst(){
  if(!user||!me)return;
  const o={};
  await Promise.all(allT.map(async t=>{
    if(t.id===user.uid){o[t.id]='mine';return}
    try{const [m,r]=await Promise.all([getDoc(doc(db,'teams',t.id,'members',user.uid)),getDoc(doc(db,'teams',t.id,'requests',user.uid))]);o[t.id]=m.exists()?'member':r.exists()?'pending':''}catch(e){o[t.id]=''}
  }));
  myst=o;render();
}
const aerr=e=>{const c=(e&&e.code)||'';return c==='auth/unauthorized-domain'?'Este endereço ainda não foi autorizado no Firebase. Avise um ADM.':(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')?'Login cancelado.':c==='auth/popup-blocked'?'O navegador bloqueou a janela do Google. Libere pop-ups ou abra no Chrome.':c==='auth/email-already-in-use'?'Esse e-mail já tem conta. Use "Entrar".':c==='auth/weak-password'?'Senha fraca: use pelo menos 6 caracteres.':c==='auth/invalid-email'?'E-mail inválido.':(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')?'E-mail ou senha incorretos.':c==='auth/operation-not-allowed'?'Este tipo de login ainda não foi ativado.':'Não foi possível entrar. Tente de novo.'};
function loginView(){
  return `<h1>Entrar</h1><p class="muted">Entre para criar ou entrar em um time. Se você abriu este link pelo TikTok, Instagram ou WhatsApp, abra no <b>Chrome</b> (menu ⋮ → Abrir no navegador): o Google pode bloquear o login por lá.</p>
<button class="b p" style="width:100%" onclick="gLogin()">Entrar com Google</button>
<h2>Ou com e-mail e senha</h2>
<label class="f"><span>E-mail</span><input type="email" value="${esc(lf.e)}" oninput="sl2('e',this.value)"></label>

<label class="f"><span>Nick no jogo</span><input maxlength="30" value="${esc(pf.n)}" oninput="spf('n',this.value)"></label>

function timesView(){

/* ---------- ranking ---------- */
function calc(){
  if(!ev)return[];
  const pts=ev.pts||[],rs=ev.rounds||[];
  return teams.slice(0,12).map(t=>{
    let p=0,k=0,b=0;const det=[];
    rs.forEach((r,qi)=>{
      const c=r&&r[t.id];if(!c)return;
      const pl=parseInt(c.p,10),kk=parseInt(c.k,10)||0;
      if(pl>=1&&pl<=12){const pt=(pts[pl-1]||0)+kk;p+=pt;k+=kk;if(pl===1)b++;det.push({q:qi+1,p:pl,k:kk,pt})}
    });
    return{n:t.name,pts:p,k,b,det};
  }).filter(r=>r.det.length).sort((a,b)=>b.pts-a.pts||b.b-a.b||b.k-a.k);
}
function rankHtml(){
  const rk=calc();
  if(!rk.length)return '<p class="muted">O ranking aparece aqui assim que a primeira queda for lançada.</p>';
  return rk.map((r,i)=>`<details class="card${i<3?' t3':''}"><summary><span class="ps">${i+1}</span><span class="nm">${esc(r.n)}<span class="sub">${r.k} abates · ${r.b} booyah${r.b===1?'':'s'}</span></span><span class="pt">${r.pts}</span></summary><table><tr><th>Queda</th><th>Colocação</th><th>Abates</th><th>Pontos</th></tr>${r.det.map(d=>`<tr><td>${d.q}</td><td>${d.p}º</td><td>${d.k}</td><td>${d.pt}</td></tr>`).join('')}</table></details>`).join('')
   +'<p class="muted">Toque em um time para ver queda por queda. Desempate: pontos, booyahs, abates.</p>';
}
const nk=x=>String(x).trim().replace(/\s+/g,' ').toLowerCase();
function agg(evs){
  const m=new Map();
  evs.forEach(e=>(e.pk||[]).forEach(x=>{
    const k=parseInt(x.k,10)||0;if(!x.n||!k)return;
    const key=nk(x.n),o=m.get(key)||{n:x.n,t:x.t||'',k:0};o.k+=k;o.t=x.t||o.t;m.set(key,o);
  }));
  return [...m.values()].sort((a,b)=>b.k-a.k||a.n.localeCompare(b.n));
}

  if(!ev)return '<p class="muted">Nenhum x-treino por aqui ainda.</p>';

  return `<h2>Top 3 · ${esc(ev.name)}</h2>`+(day.length?day.map(row).join(''):'<p class="muted">Os abates dos jogadores aparecem aqui depois do x-treino.</p>')

}

  saveProfile(){

    guard(async()=>{const b=writeBatch(db),d={nick,ffId:ff,updatedAt:serverTimestamp()};if(!me)d.createdAt=serverTimestamp();b.set(doc(db,'users',user.uid),d,{merge:true});if(team&&team.captainNick!==nick)b.update(doc(db,'teams',team.id),{captainNick:nick});await b.commit()},'Perfil salvo.');
  },
  createTeam(){

      b.set(doc(db,'teams',user.uid),{name:n,captainUid:user.uid,captainNick:me.nick,createdAt:serverTimestamp()});

  cancelReq(t){guard(async()=>{await deleteDoc(doc(db,'teams',t,'requests',user.uid));await loadMyst()})},

  rej(u){guard(()=>deleteDoc(doc(db,'teams',team.id,'requests',u)))},

    if(!confirm('Inscrever o time '+team.name+' no '+ev.name+'?'))return;
    guard(async()=>{const b=writeBatch(db);
      b.set(doc(db,'events',ev.id,'teams',id),{name:team.name,uid:user.uid,createdAt:serverTimestamp()});
      b.set(doc(db,'events',ev.id,'contacts',id),{captain:me.nick,captainUid:user.uid,p1:pl[0].nick,p2:pl[1].nick,p3:pl[2].nick,p4:pl[3].nick,s1:(sb[0]||{}).nick||'',s2:(sb[1]||{}).nick||'',createdAt:serverTimestamp()});
      await b.commit()},'Time inscrito!');
  },
  updLine(){
    const pl=mem.filter(m=>m.role==='p'),sb=mem.filter(m=>m.role==='s'),id=slug(team.name),co=cutoffMs();
    if(pl.length!==4){note('Escolha exatamente 4 titulares.','warn');return render()}
    if(co!==null&&Date.now()>co){note('A escalação travou (menos de 30 minutos para começar).','warn');return render()}
    guard(()=>updateDoc(doc(db,'events',ev.id,'contacts',id),{captain:me.nick,p1:pl[0].nick,p2:pl[1].nick,p3:pl[2].nick,p4:pl[3].nick,s1:(sb[0]||{}).nick||'',s2:(sb[1]||{}).nick||''}),'Escalação atualizada.');
  },
  sw:v=>{ew=v},
  saveWhen(){
    const v=ew||toLocalInput(),d=new Date(v);
    if(!v||isNaN(d)){note('Escolha a data e a hora.','warn');return render()}
    guard(()=>updateDoc(doc(db,'events',ev.id),{startAt:Timestamp.fromDate(d),when:fmtWhen(d)}),'Horário atualizado.');
  },
  se:(i,k,v)=>{rd[i][k]=v},
  addSec(){rd.push({t:'NOVA SEÇÃO',x:''});render()},
  rmSec(i){if(!confirm('Remover esta seção?'))return;rd.splice(i,1);render()},
  resetRegras(){if(!confirm('Voltar ao texto padrão? Nada é salvo até você tocar em Salvar regras.'))return;rd=JSON.parse(JSON.stringify(DEFAULT_REGRAS));render()},
  saveRegras(){guard(()=>setDoc(doc(db,'config','regras'),{sections:rd.filter(x=>(x.t||'').trim()||(x.x||'').trim()),updated:serverTimestamp()}),'Regras salvas.')},
  async enroll(){
    if(teams.length>=12){note('As 12 vagas já foram preenchidas.','warn');return render()}
    const name=f.n.trim(),wa=f.w.replace(/\D/g,''),id=slug(name);
    const p=[f.p1,f.p2,f.p3,f.p4].map(x=>x.trim()),sb=[f.s1,f.s2].map(x=>x.trim());
    if(name.length<2||wa.length<10||id.length<2||p.some(x=>x.length<2)){note('Preencha o nome do time, o WhatsApp com DDD e o nome dos 4 jogadores.','warn');return render()}
    busy=true;note('','ok');render();
    try{
      const b=writeBatch(db);
      b.set(doc(db,'events',ev.id,'teams',id),{name,createdAt:serverTimestamp()});
      b.set(doc(db,'events',ev.id,'contacts',id),{captain:p[0],whatsapp:wa,p1:p[0],p2:p[1],p3:p[2],p4:p[3],s1:sb[0],s2:sb[1],createdAt:serverTimestamp()});
      await b.commit();
      localStorage.setItem('xt-mine',id);f={n:'',w:'',p1:'',p2:'',p3:'',p4:'',s1:'',s2:''};note('Inscrição enviada!','ok');
    }catch(e){console.error(e);note('Não foi possível inscrever. Esse nome de time já pode estar em uso, ou as inscrições foram encerradas.','warn')}
    busy=false;render();
  },
  async login(){
    try{await signInWithEmailAndPassword(auth,lg.e.trim(),lg.p);lg.p='';msg=null}
    catch(e){note('E-mail ou senha incorretos.','warn')}
    render();
  },
  logout:()=>signOut(auth),
  toggle:()=>guard(()=>updateDoc(doc(db,'events',ev.id),{status:ev.status==='open'?'closed':'open'})),
  newEv(){
    if(nf.n.trim().length<2){note('Dê um nome ao x-treino.','warn');return render()}
    const d=new Date(nf.d);if(!nf.d||isNaN(d)){note('Escolha a data e a hora do x-treino.','warn');return render()}
    guard(async()=>{await addDoc(collection(db,'events'),{name:nf.n.trim(),when:fmtWhen(d),startAt:Timestamp.fromDate(d),status:'open',pts:[12,9,8,7,6,5,4,3,2,1,0,0],rounds:[],createdAt:serverTimestamp()});nf={n:'',d:''};cur=0;at='t'});
  },
  rm(id){
    if(!confirm('Remover este time? Os times seguintes sobem uma posição na lista. Se ele só não apareceu, deixe na lista e não lance resultados.'))return;
    guard(async()=>{const b=writeBatch(db);b.delete(doc(db,'events',ev.id,'teams',id));b.delete(doc(db,'events',ev.id,'contacts',id));if((ev.pk||[]).length)b.update(doc(db,'events',ev.id),{pk:ev.pk.filter(x=>!String(x.key).startsWith(id+':'))});await b.commit()});
  },
  addQ(){const rs=JSON.parse(JSON.stringify(ev.rounds||[]));if(!rs.length)rs.push({});rs.push({});cur=rs.length-1;guard(()=>updateDoc(doc(db,'events',ev.id),{rounds:rs}))},
  setPk(id,f,v){
    const n=(contacts[id]||{})[f];if(!n)return;
    const t=(teams.find(x=>x.id===id)||{}).name||'',pk=JSON.parse(JSON.stringify(ev.pk||[])),key=id+':'+f,i=pk.findIndex(x=>x.key===key);
    if(v===''){if(i>=0)pk.splice(i,1)}else{const k=Math.max(0,parseInt(v,10)||0);if(i>=0)pk[i]={key,n,t,k};else pk.push({key,n,t,k})}
    guard(()=>updateDoc(doc(db,'events',ev.id),{pk}));
  },
  cell(id,key,val){
    const rs=JSON.parse(JSON.stringify(ev.rounds||[]));if(!rs.length)rs.push({});
    rs[cur]=rs[cur]||{};const c=rs[cur][id]||{p:'',k:0};c[key]=val;rs[cur][id]=c;
    guard(()=>updateDoc(doc(db,'events',ev.id),{rounds:rs}));
  },
  copyTx(){
    const ta=$('tx'),b=$('cp');ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    b.textContent=ok?'Copiado!':'Segure o texto e copie';setTimeout(()=>{b.textContent='Copiar ranking'},2000);
  }
});

function render(){
  const h=location.hash,p=h==='#admin'?'admin':h==='#redes'?'redes':h==='#entrar'?'entrar':h==='#perfil'?'perfil':h==='#times'?'times':h==='#meutime'?'meutime':'inicio';
  $('app').innerHTML=p==='admin'?adminView()+'<footer><a href="#" class="muted">← Voltar ao site</a></footer>':p==='redes'?redesView():p==='entrar'?(user?perfilView():loginView()):p==='perfil'?perfilView():p==='times'?timesView():p==='meutime'?meutimeView():pubView();
  [['m1','inicio'],['m2','times'],['m3','meutime'],['m4','perfil'],['m5','redes'],['m6','admin']].forEach(([id,k])=>$(id).classList.toggle('on',k===p||(k==='perfil'&&p==='entrar')));
  const l=$('lgin');l.textContent=user?'Perfil':'Entrar';l.setAttribute('href',user?'#perfil':'#entrar');
}
(function(){
  const bg=$('bg');let sd=11;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=0;i<36;i++){
    const e=document.createElement('i');e.className='st';
    const z=5+Math.round(r()*r()*16)+(i%12===0?10:0);
    e.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(r()*96).toFixed(1)+'%;top:'+(r()*97).toFixed(1)+'%;opacity:'+(0.3+r()*0.6).toFixed(2)+';animation-delay:-'+(r()*5).toFixed(1)+'s;animation-duration:'+(3+r()*4).toFixed(1)+'s';
    bg.appendChild(e);
  }
})();
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
